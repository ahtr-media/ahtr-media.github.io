baseURL = "https://ahtr-media.github.io/"
languageCode = "ja-jp"
title = "いつもわかっている途中"
# 独自レイアウト（layouts/）。Ananke は使わない。

[params]
  description = "Always Halfway Through Realising"
  tagline = "まちづくりにおける葛藤・問い・実践の循環"
  copyright = "© 2026 Always Halfway Through Realising"
  photo_caption = "森に囲まれた大きな湖"
  photo_credit = "撮影: Giordano Rossoni"
  photo_date = "2021年11月"
  categories = [
    "はじめに",
    "葛藤のブックガイド",
    "わたしの葛藤",
    "論文のB面",
    "となりの葛藤",
    "書きかけフィールドノート",
    "1.5次元記述の実践",
  ]

ignoreFiles = ['(?i)readme\.md$']

[[cascade]]
  url = "/about/"
  [cascade.target]
    path = "/pages/about"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]
